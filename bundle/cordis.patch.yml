# Плагин-бандл: подключает скилл langflow-flows к DSH.
#
# Скилл лежит внутри пакета (skills/langflow-flows). Чтобы провайдер скиллов его
# увидел, строка skill-filesystem расширяется: к её customSkillDirs добавляется
# каталог скиллов этого пакета.
#
# Почему расширение, а не второй провайдер: второй экземпляр того же модуля
# в профиле не поднимается — плагин скиллов регистрируется один раз.
#
# Путь считается от самого файла патча:
#   baseUrl -> <пакет>/cordis.patch.yml, dirname -> <пакет>, join 'skills' -> <пакет>/skills
#
# ВАЖНО: этот слой заменяет список customSkillDirs целиком. Здесь сохранён и
# штатный каталог скиллов пресетов DSH — не удаляй первую строку списка.

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
      - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:url').fileURLToPath(baseUrl)), 'skills')
